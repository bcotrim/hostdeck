[package]
name = "hostdeck"
version = "0.1.0"
description = "macOS hosts file manager"
authors = ["Bernardo Cotrim"]
license = "MIT"
repository = "https://github.com/bcotrim/hostdeck"
homepage = "https://github.com/bcotrim/hostdeck#readme"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBezierPath", "NSButton", "NSColor", "NSControl", "NSImage", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSColorSpace", "NSImageRep"] }
